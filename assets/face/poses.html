<!DOCTYPE html><html><head><meta charset="utf-8"><title>poses</title>
<link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/face/face.css">
<style>body{background:#f3efe7;margin:0;padding:18px;font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.cell{background:#ebe5d9;padding:8px;border:1px solid rgba(0,0,0,.1)}
.cell p{margin:0 0 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#857e72}</style></head><body>
<div class="grid" id="g"></div>
<script type="module">
import { createFace, POSE_NAMES } from "/assets/face/face.js";
for (const pose of POSE_NAMES) {
  const c = document.createElement("div");
  c.className = "cell";
  c.innerHTML = `<p>${pose}</p><div class="face-art"></div>`;
  document.getElementById("g").appendChild(c);
  const prop = pose === "camera" ? "camera" : pose === "letter" ? "letter" : null;
  createFace(c.querySelector(".face-art"), { pose, prop, expression: "resting" });
}
</script></body></html>
