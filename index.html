<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amogh Bajpai — performance × machine perception</title>
    <meta name="description" content="Amogh Bajpai researches what happens to meaning when machines see, compress and regenerate expressive human bodies. Research, live pieces and tools.">
    <meta name="theme-color" content="#3a6cd6">
    <link rel="canonical" href="https://www.amoghbajpai.com/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Amogh Bajpai">
    <meta property="og:description" content="I build systems that watch people, and study where they get it wrong.">
    <meta property="og:url" content="https://www.amoghbajpai.com/">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon.png?v=1">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Pixelify+Sans:wght@400..700&family=Silkscreen&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/site.css?v=px10">
    <link rel="stylesheet" href="/assets/face/face.css?v=px8">
    <style>
        html, body { height: 100%; }
        body.world { margin: 0; overflow: hidden; background: #143a2a; touch-action: none; user-select: none; -webkit-user-select: none; }
        body.world.dragging, body.world.dragging * { cursor: grabbing !important; }
        #world { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
        .spots { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
        .spot { position: absolute; left: 0; top: 0; pointer-events: auto; -webkit-user-drag: none; outline: none; text-decoration: none; }
        .spot .tag {
            position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -10px);
            font-family: var(--pixel); font-size: 11px; letter-spacing: 0.06em; line-height: 1; color: #fff; white-space: nowrap;
            background: #140f1c; padding: 6px 9px 5px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #140f1c;
            animation: bob 1.1s steps(2) infinite;
        }
        .spot .tag::after { content: ""; position: absolute; left: 50%; top: calc(100% + 3px); width: 10px; height: 6px; margin-left: -5px; background: #140f1c;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 80% 33%, 80% 66%, 60% 66%, 60% 100%, 40% 100%, 40% 66%, 20% 66%, 20% 33%, 0 33%); }
        .spot .tag small { display: block; font-size: 8px; opacity: 0.6; margin-top: 4px; letter-spacing: 0.04em; }
        .spot:hover .tag, .spot:focus-visible .tag { background: #f3c23a; color: #140f1c; }
        .spot:hover .tag::after, .spot:focus-visible .tag::after { background: #f3c23a; }
        @keyframes bob { 50% { transform: translate(-50%, -14px); } }

        .w-top { position: fixed; left: 0; top: 0; z-index: 3; padding: 18px var(--gutter); pointer-events: none; }
        .w-name { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(26px, 3.2vw, 42px); line-height: 1; color: #fff;
            text-shadow: 3px 3px 0 #140f1c, -1px -1px 0 #140f1c, 1px -1px 0 #140f1c, -1px 1px 0 #140f1c; }
        .w-sub { margin: 10px 0 0; font-family: var(--pixel); font-size: 11px; letter-spacing: 0.06em; color: #fff; text-shadow: 2px 2px 0 #140f1c; }

        .w-hud { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; display: flex; gap: 0;
            background: #140f1c; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #140f1c; }
        .w-hud a { font-family: var(--pixel); font-size: 11px; letter-spacing: 0.06em; color: #fff; text-decoration: none; padding: 9px 14px 8px; white-space: nowrap; }
        .w-hud a:hover, .w-hud a:focus-visible { background: #f3c23a; color: #140f1c; outline: none; }
        .w-hint { position: fixed; right: var(--gutter); top: 22px; z-index: 3; margin: 0; font-family: var(--pixel); font-size: 10px; letter-spacing: 0.06em; color: #fff;
            text-shadow: 2px 2px 0 #140f1c; transition: opacity 0.6s steps(3); pointer-events: none; }
        body.explored .w-hint { opacity: 0; }
        @media (max-width: 640px) {
            .w-hud a { padding: 9px 9px 8px; font-size: 10px; }
            .w-hint { top: auto; bottom: 62px; right: 50%; transform: translateX(50%); white-space: nowrap; }
            .w-sub { display: none; }
            .w-hint .keys { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { .spot .tag { animation: none; } }
        /* the reading panel: a place's page, opened beside the map */
        .panel { position: fixed; left: 0; top: 0; bottom: 0; z-index: 10; width: min(580px, 46vw); display: flex; flex-direction: column;
            background: var(--paper); color: var(--ink); border-right: 4px solid #140f1c; box-shadow: 8px 0 0 rgba(20, 15, 28, 0.35);
            transform: translateX(calc(-100% - 16px)); transition: transform 0.3s steps(6); user-select: text; -webkit-user-select: text; touch-action: pan-y; visibility: hidden; }
        body.panel-open .panel { transform: none; visibility: visible; }
        .panel-bar { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 14px; border-bottom: 4px solid var(--ink); flex: none; }
        .panel-bar .panel-title { flex: 1; min-width: 0; margin: 0 6px; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .panel-bar button, .panel-bar a { flex: none; width: 36px; height: 36px; display: grid; place-items: center; font-family: var(--serif); font-size: 22px; line-height: 1;
            background: var(--paper); color: var(--ink); border: 0; text-decoration: none; cursor: inherit; }
        .panel-bar button:hover, .panel-bar a:hover, .panel-bar button:focus-visible, .panel-bar a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
        .panel-bar [hidden] { display: none; }
        .pb { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 22px 26px 48px; outline: none; }
        .pb[aria-busy] { opacity: 0.4; }
        .pb .wrap, .pb { max-width: none; }
        .pb .page-head, .pb .article-head { padding: 0 0 20px; }
        .pb .head-grid { display: block; }
        .pb .page-head h1, .pb .article-head h1 { font-size: clamp(30px, 3.4vw, 42px); max-width: none; margin-top: 0; }
        .pb .page-head .label { margin-bottom: 12px; }
        .pb .contact-mail { font-size: clamp(22px, 2.4vw, 30px) !important; word-break: break-all; }
        .pb .page-intro { display: block; margin-top: 20px; padding-top: 16px; }
        .pb .page-intro .label { margin: 0 0 10px; }
        .pb .page-intro p:not(.label) { font-size: 17px; }
        .pb .article-head .dek { font-size: 18px; margin-top: 14px; }
        .pb .article-body { display: block; padding-block: 24px 0; }
        .pb .article-body h2 { margin: 0 0 10px; }
        .pb .article-body .block { margin-bottom: 36px; }
        .pb .article-body p, .pb .article-body li { font-size: 16.5px; }
        .pb .article-body .pull { font-size: 24px; }
        .pb .section-head { flex-wrap: wrap; }
        .pb .section-head h2 { font-size: 26px; }
        .pb .row { grid-template-columns: 2rem minmax(0, 1fr) 1.2rem; gap: 6px 14px; padding: 18px 0; }
        .pb .row .kind { grid-column: 2; grid-row: 2; }
        .pb .row .year { display: none; }
        .pb .row .arrow { grid-column: 3; grid-row: 1; }
        .pb .row:hover, .pb .row:focus-visible { padding-inline: 10px; }
        .pb .row .title { font-size: 26px; }
        .pb .row .line { font-size: 15px; }
        .pb .facts { grid-template-columns: 1fr 1fr; gap: 20px 24px; }
        .pb .figure .plate { padding: 12px; }
        .pb-err { margin-top: 20px; }
        .pb .reel { margin: 0 0 22px; }
        .pb .reel video { display: block; width: 100%; height: auto; max-height: 62vh; object-fit: contain; background: #0b0a08; border: 4px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); }
        .pb .reel figcaption { margin-top: 10px; }
        .pb .try-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 8px 0 0; }
        .pb .try { display: inline-block; font-family: var(--pixel); font-size: 14px; letter-spacing: 0.06em; text-decoration: none; color: var(--paper); background: var(--ink); padding: 14px 20px; box-shadow: 4px 4px 0 var(--accent); }
        .pb .try:hover, .pb .try:focus-visible { background: var(--accent); color: var(--paper); box-shadow: 4px 4px 0 var(--ink); outline: none; }
        body.panel-open .w-top, body.panel-open .w-hint { opacity: 0; pointer-events: none; }
        body.panel-open .w-hud { left: calc(min(580px, 46vw) + (100vw - min(580px, 46vw)) / 2); }
        @media (max-width: 760px) {
            .panel { width: 100vw; border-right: 0; box-shadow: none; }
            body.panel-open .w-hud { display: none; }
            .pb { padding: 18px 18px 40px; }
            .pb .facts { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
    </style>
    <style>
        .spot.minor .tag { font-size: 9px; padding: 4px 7px 3px; background: #2d6fd0; }
        .screens { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .screens video { position: absolute; left: 0; top: 0; object-fit: cover; background: #05060c; display: block; }
        .screens video.crt { filter: saturate(1.2); }
        .peek { position: fixed; z-index: 7; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity 0.15s steps(2), transform 0.15s steps(2);
            background: #140f1c; padding: 6px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #140f1c, 8px 8px 0 6px rgba(20, 15, 28, 0.35); }
        .peek.on { opacity: 1; transform: none; }
        .peek video { display: block; width: 100%; object-fit: contain; background: #05060c; }
        .peek span { display: block; padding: 7px 2px 1px; font-family: var(--pixel); font-size: 10px; letter-spacing: 0.06em; color: #fff; }
        body.riding .screens, body.riding .peek { display: none; }
        .spot.minor .tag { opacity: 0; transition: opacity 0.15s steps(2); }
        .spot.minor:hover .tag, .spot.minor:focus-visible .tag { opacity: 1; }
        .spot.minor .tag small { font-size: 7px; }
        .spot-ride { background: none; border: 0; padding: 0; cursor: inherit; }
        .spot-ride .tag { background: #e2553c; }
        body.riding .spot-ride { display: none; }
        .ride-hud { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 6; width: min(440px, calc(100vw - 24px));
            background: #140f1c; color: #fff; padding: 12px 14px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #140f1c; font-family: var(--pixel); font-size: 11px; letter-spacing: 0.04em; }
        .ride-hud.hidden { display: none; }
        .ride-title { font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: 0; color: #f3c23a; }
        .ride-tip { margin: 6px 0 10px; font-family: var(--serif); font-size: 14px; letter-spacing: 0; color: #e8e2f0; line-height: 1.4; }
        .ride-tip b { color: #f3c23a; }
        .ride-tip kbd { font-family: var(--pixel); font-size: 10px; background: #2b2735; padding: 1px 5px; }
        .ride-stats { display: flex; gap: 16px; color: #b4adbf; }
        .ride-stats b { color: #fff; font-weight: 400; }
        .ride-btns { display: flex; gap: 8px; margin-top: 10px; }
        .ride-btns button { flex: 1; font-family: var(--pixel); font-size: 12px; padding: 10px; border: 0; cursor: inherit; background: #f3c23a; color: #140f1c; }
        .ride-btns button + button { flex: 0 0 auto; background: #2b2735; color: #fff; }
        .ride-btns button:hover { filter: brightness(1.1); }
        .ride-msg { position: fixed; left: 50%; top: 200px; transform: translate(-50%, 0) scale(0.6); z-index: 6; pointer-events: none; opacity: 0;
            font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 56px); color: #fff; white-space: nowrap;
            text-shadow: 4px 4px 0 #140f1c, -2px -2px 0 #140f1c, 2px -2px 0 #140f1c, -2px 2px 0 #140f1c; transition: transform 0.25s steps(3), opacity 0.2s steps(2); }
        .ride-msg.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
        .ride-msg.perfect { color: #f3c23a; } .ride-msg.great { color: #9effb0; } .ride-msg.miss { color: #ff8a7a; }
        body.riding .w-hud, body.riding .w-hint, body.riding .w-top { display: none; }
    </style>
    <style id="panel-styles"></style>
</head>
<body class="world">
    <canvas id="world" aria-hidden="true"></canvas>

    <header class="w-top">
        <h1 class="w-name">Amogh Bajpai</h1>
        <p class="w-sub">A little world where I put machines on stage. Walk around.</p>
    </header>
    <p class="w-hint">Drag to walk around<span class="keys">, or use &larr; &rarr;</span></p>

    <nav class="spots" aria-label="Places on the map">
        <a class="spot" data-place="house" href="/contact/"><span class="tag">CONTACT<small>my house</small></span></a>
        <a class="spot" data-place="lab" href="/research/"><span class="tag">RESEARCH<small>the lab</small></span></a>
        <a class="spot" data-place="head" href="/about/"><span class="tag">ABOUT<small>that's me</small></span></a>
        <a class="spot" data-place="office" href="/works/"><span class="tag">WORKS<small>the office</small></span></a>
        <a class="spot minor" data-place="cinema" href="/works/talking/"><span class="tag">TALKING<small>now showing</small></span></a>
        <a class="spot minor" data-place="easel" href="/works/lores/"><span class="tag">LORES<small>a tool</small></span></a>
        <a class="spot minor" data-place="manifold" href="/works/pixel-manifold/"><span class="tag">PIXEL MANIFOLD<small>a work</small></span></a>
        <button class="spot spot-ride" data-place="wheel" type="button" aria-label="Ride the Ferris wheel, a small game"><span class="tag">RIDE &#9654;<small>a game</small></span></button>
    </nav>

    <nav class="w-hud" aria-label="Sections">
        <a href="/contact/" data-go="house">Contact</a>
        <a href="/research/" data-go="lab">Research</a>
        <a href="/about/" data-go="head">About</a>
        <a href="/works/" data-go="office">Works</a>
    </nav>

    <aside class="panel" id="panel" aria-label="Panel">
        <div class="panel-bar">
            <button type="button" data-back aria-label="Back" title="Back" hidden>&larr;</button>
            <h2 class="panel-title"></h2>
            <a data-full href="/" aria-label="Open as a full page" title="Open as a full page">&#x2922;</a>
            <button type="button" data-close aria-label="Close" title="Close (Esc)">&times;</button>
        </div>
        <div class="pb" tabindex="-1"></div>
    </aside>

    <script src="/assets/site.js?v=px8" defer></script>
    <script type="module">
        import { createWorld } from "/assets/world/world.js?v=px24";
        import { createPanel } from "/assets/world/panel.js?v=px20";
        const world = createWorld({ canvas: document.getElementById("world"), spots: document.querySelectorAll(".spot") });
        createPanel({ world });
        // the travel bar walks you to a place; clicking it goes in
        document.querySelectorAll(".w-hud a").forEach((a) => {
            const go = () => world.lookAt(a.dataset.go);
            a.addEventListener("pointerenter", go);
            a.addEventListener("focus", go);
        });
    </script>
</body>
</html>
